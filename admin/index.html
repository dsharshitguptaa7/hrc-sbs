<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal | Harish-Chandra Research Centre</title>
</head>
<body style="margin: 0; background-color: #0B1F33; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; color: #FFFDF8;">
  <div style="text-align: center;">
    <div style="font-size: 0.9rem; letter-spacing: 0.08em; text-transform: uppercase; color: #C9A227;">
      Verifying Authorization...
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/admin/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const authed = await HRC_AUTH.init(false);
        if (authed && HRC_AUTH.currentUser && HRC_AUTH.currentProfile) {
          window.location.replace('dashboard.html');
        } else {
          window.location.replace('login.html');
        }
      } catch (e) {
        window.location.replace('login.html');
      }
    });
  </script>
</body>
</html>
